name: docs

# Publish docs-site/ to GitHub Pages.
#
# Only on main. Pull requests get the read-only sync guard in site.yml instead —
# building a fork's branch here would let it choose what gets served.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Not cancel-in-progress: a half-finished deploy of
# something published is worse than waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The root is a pnpm project, docs-site/ is an npm one. pnpm is here only
      # to run the root's `site:check` script; the cache is keyed on docs-site's
      # lockfile because that is the only install this job performs.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: npm ci --prefix docs-site

      # site:check rather than site:build. Every page here is .md, and on .md a
      # missing `// #region` only makes Starlight's loader log an error — the
      # build still exits 0, so deploying on a bare build would publish a page
      # whose snippet failed to inject. check-doc-refs.mjs is what exits
      # non-zero, and it needs no dependencies.
      - name: Build and verify
        run: pnpm run site:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

      - id: deployment
        uses: actions/deploy-pages@v5
